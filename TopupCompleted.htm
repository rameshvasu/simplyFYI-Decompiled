    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>

    <script>
    // Read query parameters
    const params = new URLSearchParams(window.location.search);

    const email = params.get("email");
    const orderId = params.get("orderId");
    const captureId = params.get("captureId");
    const timestamp = params.get("timestamp");
    const item = params.get("item_bought");
    const amount = params.get("amount");
    const currency = params.get("currency");

    // Convert timestamp if needed
    let formattedDate = "";
    if (timestamp) {
        formattedDate = new Date(timestamp).toLocaleString();
    }

    // Inject into your page
    document.querySelector(".instruction").innerHTML =
        "<br><strong>Thank you for your business. Here is a summary of your purchase:</strong>" +
        "<br><br>Payment source: PayPal<br>" +
        "Order / Transaction ID: " +  (orderId || "N/A") + "<br>" +
        "Capture ID: " + (captureId || "N/A") + "<br>" +
        "Payer Email: " + (email || "N/A") + "<br>" +
        "Transaction Date: " + (formattedDate || "N/A") + "<br><br>" + 
        "Item: " + (item || "N/A") + "<br>" +
        "Amount: " + (amount || "N/A") + " " + currency|| "N/A";
</script>
